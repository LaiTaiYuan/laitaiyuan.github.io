<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>Leonard Lai 社群分享圖片原稿</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: #405ada;
        color: #fff9eb;
        font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      }
      .card {
        width: 1200px;
        height: 630px;
        position: relative;
        padding: 64px 55px;
        border: 12px solid #141414;
      }
      .eyebrow {
        font:
          700 14px Consolas,
          monospace;
        letter-spacing: 3px;
        color: #fff9eb;
        margin: 0 0 25px;
      }
      h1 {
        font-size: 62px;
        margin: 0;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: -3px;
      }
      h1 span {
        font-size: 24px;
        display: block;
        letter-spacing: 4px;
        margin-top: 14px;
      }
      .statement {
        font-size: 42px;
        color: #ffbe23;
        font-weight: 900;
        line-height: 1.6;
        margin: 27px 0 0;
        text-shadow: 3px 3px #141414;
        position: relative;
        z-index: 1;
      }
      img {
        position: absolute;
        width: 660px;
        height: auto;
        right: 8px;
        bottom: 82px;
      }
      .foot {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 62px;
        background: #ffbe23;
        border-top: 4px solid #141414;
        color: #141414;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 45px;
        font-weight: 900;
        font-size: 17px;
      }
      .url {
        font:
          700 15px Consolas,
          monospace;
      }
      .note {
        position: absolute;
        right: 40px;
        top: 65px;
        transform: rotate(5deg);
        border: 3px solid #141414;
        background: #fff9eb;
        color: #141414;
        border-radius: 50%;
        padding: 13px 24px;
        font-size: 15px;
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">SOFTWARE × AI × MUSIC</p>
      <h1>Leonard Lai<span>賴泰元</span></h1>
      <p class="statement">聽故事、寫故事，<br />一起創造故事。</p>
      <span class="note">你的故事，我也想聽。</span>
      <img src="../public/images/leonard-lion-studio.png" alt="" />
      <div class="foot">
        <span>立足台灣 ✦ 軟體工程 ✦ AI 應用 ✦ 音樂創作</span
        ><span class="url">laitaiyuan.github.io</span>
      </div>
    </main>
  </body>
</html>
